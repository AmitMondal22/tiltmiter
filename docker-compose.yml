services:
  # 1. PostgreSQL Relational Database for Organizations, Projects, Sites, Devices, Users, & Alarms
  postgres:
    image: postgres:16-alpine
    container_name: tiltmeter_postgres
    restart: always
    environment:
      POSTGRES_DB: tiltmeter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. InfluxDB OSS Time-Series Telemetry Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: tiltmeter_influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
      DOCKER_INFLUXDB_INIT_ORG: tiltmeter_org
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2

  # 3. Fastify MVC Backend API + WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiltmeter_backend
    restart: always
    ports:
      - "5001:5001"
      - "5000:5001"
    environment:
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: super_secret_jwt_key_tiltmeter_360_prod_2026
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tiltmeter_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: my-super-secret-auth-token
      INFLUX_ORG: tiltmeter_org
      INFLUX_BUCKET: telemetry_bucket
    depends_on:
      - postgres
      - influxdb

  # 4. HTTP POST Telemetry Device Simulator
  simulator:
    build:
      context: ./shimulator
      dockerfile: Dockerfile
    container_name: tiltmeter_simulator
    restart: always
    environment:
      BACKEND_BASE_URL: http://backend:5001
    depends_on:
      - backend

  # 5. React Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiltmeter_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  influxdata:
